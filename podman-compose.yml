# PostgreSQL fuer die lokale Entwicklung.
# Start:  podman compose -f podman-compose.yml up -d
#     or: podman-compose up -d
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: makler_v4_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: makler
      POSTGRES_PASSWORD: makler
      POSTGRES_DB: makler
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5472:5432"
    volumes:
      - makler_v4_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makler -d makler"]
      interval: 5s
      timeout: 5s
      retries: 10

  sftpgo:
    image: docker.io/drakkan/sftpgo:v2.6.6
    container_name: makler_v4_sftpgo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SFTPGO_DATA_PROVIDER__DRIVER: postgresql
      SFTPGO_DATA_PROVIDER__HOST: postgres
      SFTPGO_DATA_PROVIDER__PORT: "5432"
      SFTPGO_DATA_PROVIDER__NAME: makler
      SFTPGO_DATA_PROVIDER__USERNAME: makler
      SFTPGO_DATA_PROVIDER__PASSWORD: makler
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
      SFTPGO_DEFAULT_ADMIN_USERNAME: ${SFTPGO_ADMIN_USERNAME:-makler-admin}
      SFTPGO_DEFAULT_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD:-change-me-in-env}
      SFTPGO_FTPD__BINDINGS__0__PORT: "2124"
      SFTPGO_FTPD__PASSIVE_PORT_RANGE__START: "50033"
      SFTPGO_FTPD__PASSIVE_PORT_RANGE__END: "50043"
      SFTPGO_HTTPD__BINDINGS__0__PORT: "8080"
    ports: ["2124:2124", "50033-50043:50033-50043", "8089:8080"]
    volumes: ["./storage/ftp-imports:/imports:Z"]

  openimmo-importer:
    build: .
    container_name: makler_v4_openimmo_importer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://makler:makler@postgres:5432/makler?schema=public
      IMPORT_DIR: /imports
      UPLOAD_DIR: /uploads
      WORKER_CONCURRENCY: "3"
      LOOP_DELAY: "20000"
    volumes: ["./storage/ftp-imports:/imports:Z", "./storage/uploads:/uploads:Z"]
    command: ["pnpm", "import:openimmo"]

volumes:
  makler_v4_pgdata: {}
