# In Coolify als Docker-Compose-Quelle verwenden. Nutzt die bereits bestehende
# externe Postgres-Datenbank (DATABASE_URL) statt eine eigene zu starten.
# Diese Volumes bleiben über Redeployments erhalten: FTP-Eingang und alle
# hochgeladenen Bilder. SFTPGo nutzt dieselbe Datenbank für seinen eigenen
# Namespace (eigene Tabellen, kein Konflikt mit dem App-Schema).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      UPLOAD_DIR: /app/public/uploads
      SFTPGO_API_URL: http://sftpgo:8080
      GEOCODER_CONTACT: ${GEOCODER_CONTACT:-kontakt@example.de}
      GEOCODER_URL: ${GEOCODER_URL:-https://nominatim.openstreetmap.org/search}
    depends_on: [sftpgo]
    volumes: ["uploads:/app/public/uploads"]
    # Ohne Healthcheck bleibt ein haengender Container unbemerkt stehen und
    # liefert dauerhaft Gateway Timeouts, statt neu gestartet zu werden.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [default, coolify]
  sftpgo:
    image: drakkan/sftpgo:v2.6.6
    restart: unless-stopped
    environment:
      SFTPGO_DATA_PROVIDER__DRIVER: postgresql
      SFTPGO_DATA_PROVIDER__HOST: ${POSTGRES_HOST}
      SFTPGO_DATA_PROVIDER__PORT: "5432"
      SFTPGO_DATA_PROVIDER__NAME: ${POSTGRES_DB}
      SFTPGO_DATA_PROVIDER__USERNAME: ${POSTGRES_USER}
      SFTPGO_DATA_PROVIDER__PASSWORD: ${POSTGRES_PASSWORD}
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
      SFTPGO_DEFAULT_ADMIN_USERNAME: ${SFTPGO_ADMIN_USERNAME}
      SFTPGO_DEFAULT_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD}
      SFTPGO_FTPD__BINDINGS__0__PORT: "2124"
      SFTPGO_FTPD__PASSIVE_PORT_RANGE__START: "50033"
      SFTPGO_FTPD__PASSIVE_PORT_RANGE__END: "50043"
      SFTPGO_HTTPD__BINDINGS__0__PORT: "8080"
    ports: ["2124:2124", "50033-50043:50033-50043"]
    volumes: ["ftp-imports:/imports"]
    networks: [default, coolify]
  openimmo-importer:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      IMPORT_DIR: /imports
      UPLOAD_DIR: /uploads
      WORKER_CONCURRENCY: "3"
      LOOP_DELAY: "20000"
      GEOCODER_CONTACT: ${GEOCODER_CONTACT:-kontakt@example.de}
      GEOCODER_URL: ${GEOCODER_URL:-https://nominatim.openstreetmap.org/search}
    volumes: ["ftp-imports:/imports", "uploads:/uploads"]
    # Der Importer traegt beim Start zuerst fehlende Koordinaten nach und
    # geht danach in die Dauerschleife des OpenImmo-Workers.
    command: ["sh", "-c", "pnpm prisma migrate deploy && pnpm geocode:backfill && pnpm import:openimmo"]
    networks: [default, coolify]
volumes:
  ftp-imports: {}
  uploads: {}
networks:
  coolify:
    external: true
